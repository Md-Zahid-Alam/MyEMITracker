name: Build Signed Release

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Restore permanent signing key
        env:
          MFT_SIGNING_KEY_BASE64: ${{ secrets.MFT_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$MFT_SIGNING_KEY_BASE64" ]; then
            echo "::error::Missing repository secret MFT_SIGNING_KEY_BASE64"
            exit 1
          fi
          echo "$MFT_SIGNING_KEY_BASE64" | base64 --decode > app/mft-signing-key.p12

      - name: Build signed release APK and Play bundle
        env:
          MFT_SIGNING_STORE_FILE: mft-signing-key.p12
          MFT_SIGNING_PASSWORD: ${{ secrets.MFT_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MFT_SIGNING_PASSWORD" ]; then
            echo "::error::Missing repository secret MFT_SIGNING_PASSWORD"
            exit 1
          fi
          gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: My-Finance-Tracker-V8.3-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v6
        with:
          name: My-Finance-Tracker-V8.3-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
