name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Restore permanent signing key
        env:
          MFT_SIGNING_KEY_BASE64: ${{ secrets.MFT_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$MFT_SIGNING_KEY_BASE64" ]; then
            echo "::error::Missing repository secret MFT_SIGNING_KEY_BASE64"
            exit 1
          fi
          echo "$MFT_SIGNING_KEY_BASE64" | base64 --decode > app/mft-signing-key.p12

      - name: Build signed APK
        env:
          MFT_SIGNING_STORE_FILE: mft-signing-key.p12
          MFT_SIGNING_PASSWORD: ${{ secrets.MFT_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MFT_SIGNING_PASSWORD" ]; then
            echo "::error::Missing repository secret MFT_SIGNING_PASSWORD"
            exit 1
          fi
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: My-Finance-Tracker-V4.9-owner-package
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
